# English Language Configuration
language:
  code: eng
  name: English

# Data paths (relative to code/ directory)
data:
  # UniMorph data (3 columns: lemma, features, form)
  unimorph:
    train: "data/unimorph/eng.trn"
    dev: "data/unimorph/eng.dev"
    test: "data/unimorph/eng.tst"
  
  # Universal Dependencies data with context (4 columns: lemma, features, form, context)
  ud:
    train: "data/ud/eng_verbs_context.trn"
    dev: "data/ud/eng_verbs_context.dev"
    test: "data/ud/eng_verbs_context.tst"
