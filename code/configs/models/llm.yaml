# LLM Baseline Configuration
model_type: llm
task: inverse  # Only inverse task for LLMs
data_source: ud  # Uses UD data (with context)
model_name: llama  # Options: llama, qwen, or full model name

# Output settings
output_dir_template: "results/llm-{model}-{lang}"

# API settings
temperature: 0.0
rate_limit_delay: 0.5  # seconds between requests
max_tokens: 10000
timeout: 60

# Example for few-shot prompting (Portuguese)
example_input: "gosta\tAquele cliente gosta apenas de vinho branco ."
example_prediction: "gostar\tV;IND;SG;3;PRS"

# Prompt template
prompt_template: "Generate the lemma and morphological tags for the following inflected verb and context. IMPORTANT: Provide ONLY the answer in the exact format 'lemma<tab>tags' with NO explanations, NO commentary, NO additional text: "
