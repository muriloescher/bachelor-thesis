# ByT5 Inverse (Analysis) Model Configuration
model_type: byt5
task: inverse  # inflected form -> lemma+features
data_source: unimorph  # Uses UniMorph data (no context)

# Model settings
model_name: google/byt5-small
output_dir_template: "results/byt5-inverse-{lang}"

# Training hyperparameters
training:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  num_train_epochs: 3
  learning_rate: 1.0e-4
  warmup_steps: 100
  weight_decay: 0.01
  lr_scheduler_type: linear
  logging_steps: 10
  save_steps: 100
  save_total_limit: 1
  eval_strategy: steps
  eval_steps: 50
  fp16: false
  seed: 42
  predict_with_generate: true
  generation_max_length: 128

# Prediction settings
prediction:
  batch_size: 16
  max_length: 128

# Prompts
prompts:
  inverse: "Generate the lemma and morphological tags for the following inflected verb: {form}"
