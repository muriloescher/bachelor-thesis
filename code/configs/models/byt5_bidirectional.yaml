# ByT5 Bidirectional Model Configuration
model_type: byt5
task: bidirectional  # 50/50 mix of forward and inverse
data_source: unimorph  # Uses UniMorph data (no context)

# Model settings
model_name: google/byt5-small
output_dir_template: "results/byt5-bidir-{lang}"

# Training hyperparameters
training:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  num_train_epochs: 3
  learning_rate: 1.0e-4
  warmup_steps: 100
  weight_decay: 0.01
  lr_scheduler_type: linear
  logging_steps: 10
  save_steps: 100
  save_total_limit: 1
  eval_strategy: steps
  eval_steps: 50
  fp16: false
  seed: 42
  predict_with_generate: true
  generation_max_length: 128

# Prediction settings
prediction:
  batch_size: 16
  max_length: 128
  inverse_only: false  # Set to true to skip forward predictions

# Prompts
prompts:
  forward: "Generate the inflected form for: {lemma} {features}"
  inverse: "Generate the lemma and morphological tags for the following inflected verb: {form}"
